name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:env
      # só compara se o Backend estiver ao lado (no CI isolado do front, avisa e passa)
      - run: npm run sync:shared -- --check
      - run: npm run lint
      - run: npm test
      - run: npm run build
